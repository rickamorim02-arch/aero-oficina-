<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1529"><title>Aero Oficina</title><style>body{margin:0;background:#0b1529;color:#eef4ff;font:16px system-ui}header,main{max-width:760px;margin:auto;padding:18px}h1{margin:0}small{color:#9db3d0}.tabs,.parts,.actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}button,select,input{background:#1e3454;color:white;border:1px solid #47648b;border-radius:12px;padding:12px;font:inherit}button.active{background:#177caa}section{background:#142540;border-radius:18px;padding:18px;margin:14px 0}svg{width:100%;height:220px;background:radial-gradient(#264c78,#101f35);border-radius:16px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#203757;border-radius:10px;padding:12px}.stat b{display:block;font-size:22px}#report{white-space:pre-line;line-height:1.6}label{display:block;margin:12px 0}select{width:100%}</style></head><body><header><h1>✈ Aero Oficina</h1><small>Construa, ajuste e teste aviões e naves • protótipo educativo</small></header><main><div class="tabs"><button id="air" class="active" onclick="mode='air';render()">✈ Avião</button><button id="space" onclick="mode='space';render()">🚀 Nave</button></div><section><h2>Oficina</h2><svg viewBox="0 0 400 220" role="img" aria-label="Visualização ilustrativa do veículo"><g id="vehicle"></g></svg><div id="parts"></div></section><section><h2>Indicadores estimados</h2><div class="stats" id="stats"></div><small>Modelo simplificado para aprendizado, não adequado a projetos reais.</small></section><section><h2>Simulação</h2><div class="actions"><button onclick="testFlight()">▶ Testar projeto</button><button onclick="save()">Salvar</button><button onclick="reset()">Novo projeto</button></div><div id="report">Selecione as peças e inicie o teste.</div></section></main><script>let mode='air';const configs={air:[['Estrutura',['Leve','Média','Pesada']],['Asas',['Curtas','Médias','Longas']],['Motor',['Econômico','Padrão','Potente']],['Combustível',['Pequeno','Médio','Grande']]],space:[['Estrutura',['Leve','Média','Pesada']],['Propulsão',['Química','Elétrica','Avançada']],['Tanques',['Pequenos','Médios','Grandes']],['Carga',['Leve','Média','Pesada']]]};let selections={air:[1,1,1,1],space:[1,0,1,0]};try{const v=JSON.parse(localStorage.getItem('aero-oficina'));if(v&&v.air&&v.space)selections=v}catch{}function render(){document.getElementById('air').className=mode==='air'?'active':'';document.getElementById('space').className=mode==='space'?'active':'';document.getElementById('parts').innerHTML=configs[mode].map(([name,options],i)=>`<label>${name}<select onchange="selections[mode][${i}]=+this.value;render()">${options.map((o,j)=>`<option value="${j}" ${selections[mode][i]===j?'selected':''}>${o}</option>`).join('')}</select></label>`).join('');let s=selections[mode],mass=mode==='air'?850+s[0]*420+s[1]*130+s[2]*180+s[3]*240:2200+s[0]*900+s[1]*500+s[2]*750+s[3]*1100,power=mode==='air'?650+s[2]*480:1400+s[1]*800,range=mode==='air'?Math.round((500+s[3]*480)*(power/mass)):Math.round((900+s[2]*800)*(power/mass)),stability=mode==='air'?Math.max(15,Math.min(98,65+s[1]*17-s[0]*8-s[2]*9)):Math.max(15,Math.min(98,75-s[0]*8-s[3]*12+s[1]*5)),cost=Math.round((mass*65+power*110)/1000);document.getElementById('stats').innerHTML=[['Massa',mass+' kg'],['Potência (índice)',power],['Autonomia (índice)',range],['Estabilidade',stability+'%'],['Custo fictício',cost+' créditos']].map(([k,v])=>`<div class="stat">${k}<b>${v}</b></div>`).join('');document.getElementById('vehicle').innerHTML=mode==='air'?`<g fill="#8acaf0" stroke="#e3f5ff" stroke-width="3"><path d="M190 25 Q200 10 210 25 L218 95 L${260+s[1]*32} 137 L${260+s[1]*32} 153 L216 143 L212 184 L242 199 L242 207 L200 199 L158 207 L158 199 L188 184 L184 143 L${140-s[1]*32} 153 L${140-s[1]*32} 137 L182 95Z"/></g>`:`<g stroke="#e3f5ff" stroke-width="3"><path fill="#9ad2f5" d="M200 18 Q245 65 240 150 L160 150 Q155 65 200 18Z"/><rect x="175" y="150" width="50" height="30" fill="#497ca6"/><path fill="#f59e64" d="M180 180 L165 215 L200 197 L235 215 L220 180Z"/><circle cx="200" cy="88" r="20" fill="#183c67"/></g>`;window.metrics={mass,power,range,stability};}function testFlight(){const m=metrics;let good=m.stability>=55&&m.power/m.mass>(mode==='air'?.42:.32);document.getElementById('report').textContent=(good?'✅ Simulação concluída com sucesso!':'⚠️ Projeto precisa de ajustes.')+'\n'+(mode==='air'?'Etapas: decolagem → subida → cruzeiro → pouso.':'Etapas: lançamento → subida → trajetória → retorno.')+'\n'+(good?'O equilíbrio simplificado entre potência, massa e estabilidade é suficiente.':'Experimente reduzir a massa, aumentar a potência ou melhorar a estabilidade.')+'\nResultado ilustrativo, não é simulação física certificada.'}function save(){localStorage.setItem('aero-oficina',JSON.stringify(selections));document.getElementById('report').textContent='Projeto salvo neste navegador.'}function reset(){selections[mode]=mode==='air'?[1,1,1,1]:[1,0,1,0];render();document.getElementById('report').textContent='Novo projeto iniciado.'}render()</script></body></html>
